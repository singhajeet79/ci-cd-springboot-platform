version: '3'

services:
  jhooq-springboot-container:
    image: jhooq-spring-boot-docker-compose:1
    build:
      context: ./
      dockerfile: Dockerfile
    volumes:
      - /data/jhooq-springboot-container
    ports:
      - "8080-8100:8080"
services:
  app:
    build: ./app
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus

  grafana:
    image: grafana/grafana
